schema_version: 1

context:
  version: "1.3.7"

package:
  name: djongo
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/96/c6/5f18c9381e4f416672a610bf8c1f23cdbe53bf8e18d0397d373256aa55d2/djongo-${{ version }}.tar.gz
  sha256: 347f5a310c8111a3e4a540294533c7a975e5a9e1766ef63b62bf044c9d64bab6
  patches:
    - patches/0001-widen-the-pymongo-ceiling.patch

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }},<3.12
    - django >=2.1,<=3.1.12
    - pymongo >=3.7.0,<4
    - pytz >=2018.5
    - sqlparse ==0.2.4

tests:
  - python:
      imports:
        - djongo
        - djongo.base
        - djongo.cursor
        - djongo.database
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  homepage: https://www.djongomapper.com/
  repository: https://github.com/doableware/djongo
  documentation: https://www.djongomapper.com/docs/
  license: AGPL-3.0-only
  license_file: LICENSE
  summary: Driver for allowing Django to use MongoDB as the database backend
  description: |
    djongo lets an existing Django project talk to MongoDB without rewriting
    its models. It translates the SQL that Django's ORM emits into MongoDB
    queries, so migrations, the admin and the usual QuerySet API keep
    working against a Mongo database.

extra:
  recipe-maintainers:
    - marcelotrevisani
    - killua156
